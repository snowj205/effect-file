<body>
<div class="container">
  <h1>🎤 영어 말하기 연습</h1>
  <p class="description">

  <div class="top">

  </div>

  <div class="progress-text">

  <div class="card">
    <div class="label">이 문장을 영어로 말해 보세요.</div>
    <div class="question" id="question"></div>
    <div class="answer" id="answer" hidden></div>
    <div class="hint" id="hint">정답을 보지 않고 먼저 말해 보세요!</div>
  </div>

  <div class="buttons">
    <button class="mic" id="micButton">🎙️ 영어로 말하기</button>
    <button id="answerButton">정답 확인</button>
    <button id="listenButton">🔊 영어 듣기</button>
  </div>

  <div class="buttons">
    <button id="prevButton">← 이전 문제</button>
    <button class="primary" id="nextButton">다음 문제 →</button>
  </div>

  <div class="buttons">
    <button id="resultButton">결과 보기</button>
    <button id="resetButton">처음부터 다시</button>
  </div>

  <div class="status" id="status" aria-live="polite">
    마이크 버튼을 누르고 영어로 말해 보세요.
  </div>

  <div class="results" id="results">
    <h2>📊 연습 결과</h2>
    <div id="summary"></div>
    <div id="resultList"></div>
    <div class="buttons">
      <button class="primary" id="retryButton">틀린 문제 다시 풀기</button>
    </div>
  </div>

  <div class="note">
    ※ 음성 인식은 발음 자체를 전문적으로 평가하는 기능이 아니라,
    인식된 문장과 정답을 비교하는 기능입니다.<br>
    ※ 마이크 기능은 인터넷에 연결된 Chrome에서 사용하는 것을 권장합니다.
  </div>
</div>

<script>
/*
문제를 추가하려면 아래에 다음 형식으로 추가하세요.
{ ko: "한글 문장", en: "English sentence." },
*/

const questions = [
  { ko: "나는 개 한 마리를 가지고 있어.", en: "I have a dog." },
  { ko: "그 개는 상자 위에 있어.", en: "The dog is on the box." },
  { ko: "코끼리 세 마리가 동물원으로 걸어가.", en: "Three elephants walk to the zoo." },
  { ko: "나는 식당에 가고 싶어.", en: "I want to go to the restaurant." },
  { ko: "그 고양이는 의자 아래에 있어.", en: "The cat is under the chair." },
  { ko: "나는 사과 한 개를 먹어.", en: "I eat an apple." },
  { ko: "그 소년은 공을 가지고 있어.", en: "The boy has a ball." },
  { ko: "그 소녀는 책을 읽어.", en: "The girl reads a book." },
  { ko: "나는 학교에 걸어가.", en: "I walk to school." },
  { ko: "그 새는 나무 위에 있어.", en: "The bird is in the tree." },
  { ko: "나는 물을 마시고 싶어.", en: "I want to drink water." },
  { ko: "그들은 공원에서 놀아.", en: "They play in the park." },
  { ko: "내 동생은 키가 커.", en: "My brother is tall." },
  { ko: "그녀는 파란 가방을 가지고 있어.", en: "She has a blue bag." },
  { ko: "나는 매일 영어를 공부해.", en: "I study English every day." },
  { ko: "그는 아침을 먹어.", en: "He eats breakfast." },
  { ko: "우리는 음악을 좋아해.", en: "We like music." },
  { ko: "그 공은 책상 아래에 있어.", en: "The ball is under the desk." },
  { ko: "나는 엄마와 함께 요리해.", en: "I cook with my mom." },
  { ko: "그 강아지들은 빠르게 달려.", en: "The puppies run fast." }
];

let active = [];
let index = 0;
let records = {};
let shown = {};
let recognition = null;
let session = 0;

const $ = id => document.getElementById(id);

function normalize(text) {
  return text.toLowerCase()
    .replace(/[’']/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function similarity(a, b) {
  const x = normalize(a).split(" ").filter(Boolean);
  const y = normalize(b).split(" ").filter(Boolean);

  if (!x.length || !y.length) return 0;

  const dp = Array.from(
    { length: x.length + 1 },
    () => Array(y.length + 1).fill(0)
  );

  for (let i = 0; i <= x.length; i++) dp[i][0] = i;
  for (let j = 0; j <= y.length; j++) dp[0][j] = j;

  for (let i = 1; i <= x.length; i++) {
    for (let j = 1; j <= y.length; j++) {
      const cost = x[i - 1] === y[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }

  return Math.max(
    0,
    1 - dp[x.length][y.length] / Math.max(x.length, y.length)
  );
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[ch]);
}

function currentId() {
  return active[index];
}

function currentQuestion() {
  return questions[currentId()];
}

function stopMic() {
  session++;
  if (recognition) {
    try { recognition.abort(); } catch (e) {}
  }
  recognition = null;
  $("micButton").textContent = "🎙️ 영어로 말하기";
}

function loadQuestions() {
  const value = $("range").value;

  if (value === "wrong") {
    active = questions.map((q, i) => i)
      .filter(i => records[i] && !records[i].correct);

    if (!active.length) {
      $("status").textContent =
        "틀린 문제가 없어요. 먼저 문제를 풀어 보세요!";
      $("range").value = "all";
      active = questions.map((q, i) => i);
    }
  } else if (value === "1") {
    active = questions.map((q, i) => i).filter(i => i < 10);
  } else if (value === "2") {
    active = questions.map((q, i) => i).filter(i => i >= 10 && i < 20);
  } else {
    active = questions.map((q, i) => i);
  }

  index = 0;
  $("results").style.display = "none";
  render();
}

function render() {
  if (!active.length) return;

  const id = currentId();
  const q = currentQuestion();
  const answered = records[id];

  $("question").textContent = q.ko;
  $("answer").textContent = "정답: " + q.en;
  $("answer").hidden = !shown[id];

  $("hint").textContent = shown[id]
    ? "정답을 확인했어요. 다시 말해 보세요!"
    : "영어로 먼저 말한 뒤 정답을 확인해 보세요!";

  $("progressText").textContent =
    (index + 1) + " / " + active.length + "번";

  $("progressFill").style.width =
    ((index + 1) / active.length * 100) + "%";

  const correctCount =
    Object.values(records).filter(r => r.correct).length;

  $("scoreText").textContent = "맞힌 문제: " + correctCount + "개";
  $("prevButton").disabled = index === 0;
  $("nextButton").disabled = index === active.length - 1;

  if (answered) {
    $("status").innerHTML =
      "인식한 문장: <b>" + escapeHTML(answered.spoken) + "</b><br>" +
      (answered.correct
        ? '<span class="good">잘했어요! 정답으로 인정했어요.</span>'
        : '<span class="bad">다시 말해 보세요.</span>') +
      "<br>유사도: " + answered.percent + "%";
  } else {
    $("status").textContent =
      "마이크 버튼을 누르고 영어로 말해 보세요.";
  }
}

function startMic() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    $("status").textContent =
      "음성 인식을 지원하지 않아요. Chrome 브라우저에서 사이트를 열어 주세요.";
    return;
  }

  stopMic();
  const thisSession = session;
  const id = currentId();
  const q = currentQuestion();

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    if (thisSession !== session) return;
    $("micButton").textContent = "🎙️ 듣고 있어요...";
    $("status").textContent = "영어로 말해 보세요!";
  };

  recognition.onresult = event => {
    if (thisSession !== session) return;

    const alternatives = Array.from(event.results[0])
      .map(result => result.transcript.trim())
      .filter(Boolean);

    let best = alternatives[0] || "";
    let bestScore = similarity(best, q.en);

    alternatives.slice(1).forEach(text => {
      const score = similarity(text, q.en);
      if (score > bestScore) {
        best = text;
        bestScore = score;
      }
    });

    const percent = Math.round(bestScore * 100);
    const correct =
      normalize(best) === normalize(q.en) || bestScore >= 0.85;

    records[id] = {
      spoken: best,
      correct,
      percent
    };

    shown[id] = true;
    render();

    $("status").innerHTML =
      "인식한 문장: <b>" + escapeHTML(best) + "</b><br>" +
      (correct
        ? '<span class="good">🎉 잘했어요!</span>'
        : '<span class="bad">조금 달라요. 다시 말해 보세요.</span>') +
      "<br>정답: <b>" + escapeHTML(q.en) + "</b>" +
      "<br>유사도: " + percent + "%";
  };

  recognition.onerror = event => {
    if (thisSession !== session) return;

    let message = "음성 인식 중 문제가 발생했어요.";

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      message = "마이크 권한을 허용해 주세요. Chrome 주소창 왼쪽의 사이트 설정을 확인하세요.";
    } else if (event.error === "no-speech") {
      message = "목소리가 들리지 않았어요. 다시 말해 보세요.";
    } else if (event.error === "network") {
      message = "인터넷 연결을 확인해 주세요.";
    } else if (event.error === "audio-capture") {
      message = "마이크가 연결되어 있는지 확인해 주세요.";
    } else if (event.error === "aborted") {
      return;
    }

    $("status").textContent = message;
  };

  recognition.onend = () => {
    if (thisSession !== session) return;
    $("micButton").textContent = "🎙️ 영어로 말하기";
  };

  try {
    recognition.start();
  } catch (e) {
    $("status").textContent = "다시 마이크 버튼을 눌러 주세요.";
  }
}

function listenEnglish() {
  if (!("speechSynthesis" in window)) {
    $("status").textContent = "이 브라우저에서는 영어 음성을 재생할 수 없어요.";
    return;
  }

  const utterance = new SpeechSynthesisUtterance(currentQuestion().en);
  utterance.lang = "en-US";
  utterance.rate = 0.85;

  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => /^en-US$/i.test(v.lang));
  if (voice) utterance.voice = voice;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function showResults() {
  stopMic();

  const attempted = active.filter(id => records[id]);
  const correct = attempted.filter(id => records[id].correct).length;
  const wrong = attempted.length - correct;

  $("summary").innerHTML =
    "<p>전체 문제: <b>" + active.length + "개</b></p>" +
    "<p>시도한 문제: <b>" + attempted.length + "개</b></p>" +
    '<p class="good">맞힌 문제: ' + correct + "개</p>" +
    '<p class="bad">틀린 문제: ' + wrong + "개</p>" +
    "<p>아직 풀지 않은 문제: " +
    (active.length - attempted.length) + "개</p>";

  $("resultList").innerHTML = attempted.map(id => {
    const q = questions[id];
    const r = records[id];

    return '<div class="result-item">' +
      "<b>" + (id + 1) + ". " + escapeHTML(q.ko) + "</b><br>" +
      "정답: " + escapeHTML(q.en) + "<br>" +
      "내가 말한 문장: " + escapeHTML(r.spoken) + "<br>" +
      (r.correct
        ? '<span class="good">정답'
        : '<span class="bad">다시 연습') +
      " · " + r.percent + "%</span></div>";
  }).join("");

  $("results").style.display = "block";
  $("results").scrollIntoView({ behavior: "smooth" });
}

$("micButton").addEventListener("click", startMic);

$("answerButton").addEventListener("click", () => {
  shown[currentId()] = true;
  render();
});

$("listenButton").addEventListener("click", listenEnglish);

$("prevButton").addEventListener("click", () => {
  stopMic();
  if (index > 0) index--;
  render();
});

$("nextButton").addEventListener("click", () => {
  stopMic();
  if (index < active.length - 1) {
    index++;
    render();
  }
});

$("resultButton").addEventListener("click", showResults);

$("resetButton").addEventListener("click", () => {
  stopMic();
  records = {};
  shown = {};
  index = 0;
  $("results").style.display = "none";
  render();
  $("status").textContent = "처음부터 다시 시작해요!";
});

$("retryButton").addEventListener("click", () => {
  $("range").value = "wrong";
  loadQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("range").addEventListener("change", () => {
  stopMic();
  loadQuestions();
});

loadQuestions();
</script>
</body>
</html>
```
